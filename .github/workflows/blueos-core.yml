name: BlueOS recovery core
on:
  push:
    branches: ['codex/recover-blueos-v0.1.0']
  pull_request:
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test blueos/tests/*.test.js
      - run: node blueos/scripts/verify-source.mjs
      - run: node blueos/scripts/vectors.js && git diff --exit-code -- protocol/vectors.json
